# (a) Centralized + cosine LR + focal loss
data:
  name: cicids2017
  path: "data/raw/CIC-IDS2017"
  max_samples: 2000000
  binary: true
  use_smote: true
  balance_ratio: 4.0

model:
  name: mlp

evaluation:
  prediction_threshold: 0.3

federated:
  num_rounds: 80
  local_epochs: 2
  batch_size: 128
  learning_rate: 0.0005
  use_class_weights: true
  use_focal_loss: true
  focal_loss_alpha: 0.7
  lr_decay_type: cosine
  lr_min: 0.0001
  use_qat: false
